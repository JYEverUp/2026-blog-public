<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="550" viewBox="0 0 1320 550" role="img" aria-labelledby="title">
  <title id="title">我怎么创建飞书应用</title>
  <rect width="1320" height="550" fill="#f2f7fb"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <text x="60" y="71" font-size="42" font-weight="700" fill="#132437">我怎么创建飞书应用</text>
  <text x="60" y="119" font-size="24" fill="#3d556b">从飞书开放平台进入应用管理。</text>
  <rect x="60" y="156" width="1200" height="92" rx="16" fill="#fff" stroke="#c9d8e5"/>
  <text x="87" y="192" font-size="27" font-weight="700" fill="#132437">企业自建应用</text>
  <text x="87" y="227" font-size="22" fill="#3d556b">选「创建企业自建应用」，填写应用名称和用途。</text>
  <rect x="60" y="276" width="1200" height="92" rx="16" fill="#fff" stroke="#c9d8e5"/>
  <text x="87" y="312" font-size="27" font-weight="700" fill="#132437">机器人能力</text>
  <text x="87" y="347" font-size="22" fill="#3d556b">进入应用后启用机器人，并把应用可见范围限定在测试账号。</text>
  <rect x="60" y="396" width="1200" height="92" rx="16" fill="#fff" stroke="#c9d8e5"/>
  <text x="87" y="432" font-size="27" font-weight="700" fill="#132437">凭证与基础信息</text>
  <text x="87" y="467" font-size="22" fill="#3d556b">准备同一应用的 App ID 和 App Secret，供 OpenClaw 通道向导使用。</text>
  </g>
</svg>
